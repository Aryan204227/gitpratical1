name: Materialize ClubPulse source

on:
  push:
    branches:
      - clubpulse-accessible-source
    paths:
      - .github/workflows/materialize-clubpulse-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the working branch
        uses: actions/checkout@v4
        with:
          ref: clubpulse-accessible-source
          persist-credentials: true

      - name: Check archive parts
        shell: bash
        run: |
          set -euo pipefail
          test -d clubpulse-phase1a/parts
          find clubpulse-phase1a/parts -maxdepth 1 -type f -name 'part-*.b64' | sort > /tmp/parts.txt
          echo "Part count: $(wc -l < /tmp/parts.txt)"
          cat /tmp/parts.txt
          test -s /tmp/parts.txt

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r part; do cat "$part"; done < /tmp/parts.txt > /tmp/clubpulse-source.b64
          echo "Base64 bytes: $(wc -c < /tmp/clubpulse-source.b64)"
          base64 --decode /tmp/clubpulse-source.b64 > /tmp/clubpulse-source.tar.gz
          echo "Archive bytes: $(wc -c < /tmp/clubpulse-source.tar.gz)"
          file /tmp/clubpulse-source.tar.gz

      - name: Validate and extract source
        shell: bash
        run: |
          set -euo pipefail
          gzip --test /tmp/clubpulse-source.tar.gz
          mkdir -p /tmp/clubpulse-source
          tar -xzf /tmp/clubpulse-source.tar.gz -C /tmp/clubpulse-source
          test -f /tmp/clubpulse-source/package.json
          test -d /tmp/clubpulse-source/src
          node -e "const p=require('/tmp/clubpulse-source/package.json'); console.log(p.name, p.version, p.dependencies?.next, p.dependencies?.mongoose)"

      - name: Extract directly into the accessible folder
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf clubpulse-app
          mkdir -p clubpulse-app
          tar -xzf /tmp/clubpulse-source.tar.gz -C clubpulse-app
          echo "Tar extraction finished."

      - name: Normalize source permissions top-down
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import os
          root = "clubpulse-app"
          for base, dirs, files in os.walk(root, topdown=True):
              os.chmod(base, 0o755)
              for name in dirs:
                  os.chmod(os.path.join(base, name), 0o755)
              for name in files:
                  os.chmod(os.path.join(base, name), 0o644)
          print("Materialized", sum(len(files) for _, _, files in os.walk(root)), "source files.")
          PY
          test -f clubpulse-app/package.json
          test -d clubpulse-app/src

      - name: Remove compressed source bundles from this working branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf clubpulse-deploy clubpulse-phase1a

      - name: Commit the accessible source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A clubpulse-app clubpulse-deploy clubpulse-phase1a
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Materialize ClubPulse source as accessible files"
          git push origin HEAD:clubpulse-accessible-source
