name: ClubPulse checks

on:
  push:
    branches:
      - main
      - 'fix/**'
    paths:
      - 'clubpulse-preview/**'
      - '.github/workflows/clubpulse-checks.yml'
  pull_request:
    paths:
      - 'clubpulse-preview/**'
      - '.github/workflows/clubpulse-checks.yml'

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clubpulse-preview
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Type-check Next.js application
        run: npm run lint
