<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="refresh" content="0;url=/">
  <meta name="robots" content="noindex,nofollow">
  <title>ClubPulse — Live Workspace</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0f1a;--panel:#121829;--line:#29364b;--text:#f4f6fb;--muted:#8fa3bf;--lime:#c6ff3d}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,#c6ff3d0a,transparent 50%),var(--bg);color:var(--text);font:16px/1.6 Inter,ui-sans-serif,system-ui,sans-serif;padding:24px}
    main{width:min(580px,100%);padding:clamp(24px,5vw,44px);border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,var(--panel),#0e1420)}
    .mark{width:44px;height:44px;display:grid;place-items:center;border:1px solid #c6ff3d40;border-radius:13px;color:var(--lime);font-size:24px;background:#c6ff3d0a}
    h1{font-size:clamp(26px,5vw,36px);letter-spacing:-1px;margin:20px 0 8px}p{color:var(--muted);font-size:14px}.status{display:inline-flex;align-items:center;gap:8px;color:var(--lime);font-size:11px;letter-spacing:1px;font-weight:800;text-transform:uppercase}.dot{width:7px;height:7px;background:var(--lime);border-radius:50%}
    a{display:inline-flex;margin-top:14px;padding:11px 15px;border-radius:9px;background:var(--lime);color:var(--bg);font-size:13px;font-weight:850;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✳</div>
    <p class="status"><span class="dot"></span> Database-backed workspace</p>
    <h1>ClubPulse has moved.</h1>
    <p>This legacy prototype has been retired. The live application calculates its metrics from persisted workspace records; this file contains no dashboard counters or sample member records.</p>
    <a href="/">Open ClubPulse</a>
  </main>
</body>
</html>
