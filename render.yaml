services:
  - type: web
    name: clubpulse-live
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/Aryan204227/gitpratical1
    branch: main
    rootDir: clubpulse-preview
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/live
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: clubpulse-db
          property: connectionString
      - key: NEXT_PUBLIC_APP_URL
        value: https://clubpulse-live.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_SECRET
        sync: false
      - key: NEXT_PUBLIC_BOOTSTRAP_ADMIN_ENABLED
        sync: false
      - key: VITE_BOOTSTRAP_ADMIN_ENABLED
        sync: false
      - key: PGSSL
        sync: false
